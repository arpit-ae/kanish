<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Secure Payment - USOA GROUP</title>

  <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      padding: 30px 15px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .product {
      background: #f5f5f5;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .product-name {
      font-size: 18px;
      font-weight: bold;
    }

    .price {
      font-size: 24px;
      font-weight: bold;
      margin-top: 8px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .secure {
      margin-top: 20px;
      text-align: center;
      color: #555;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>USOA GROUP</h1>

    <div class="product">
      <div class="product-name" id="productName">
        Loading...
      </div>

      <div class="price" id="productPrice">
        ₹0
      </div>
    </div>

    <form id="paymentForm">

      <label for="name">Full Name</label>
      <input
        type="text"
        id="name"
        required
        maxlength="100"
        placeholder="Enter your name"
      >

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        required
        placeholder="Enter your email"
      >

      <label for="phone">Mobile Number</label>
      <input
        type="tel"
        id="phone"
        required
        maxlength="10"
        pattern="[0-9]{10}"
        placeholder="10-digit mobile number"
      >

      <button type="submit" id="payButton">
        Pay Securely
      </button>

    </form>

    <div class="message" id="message"></div>

    <div class="secure">
      🔒 Secure payment powered by Cashfree
    </div>

  </div>

</div>

<script>

  const PRODUCTS = {
    honey500: {
      name: "Natural Raw Honey - 500g",
      amount: 399
    },

    beeswax1kg: {
      name: "Pure Beeswax - 1kg",
      amount: 699
    }
  };

  const params = new URLSearchParams(
    window.location.search
  );

  const productId =
    params.get("product") || "honey500";

  const product =
    PRODUCTS[productId];

  const productName =
    document.getElementById("productName");

  const productPrice =
    document.getElementById("productPrice");

  const message =
    document.getElementById("message");

  const payButton =
    document.getElementById("payButton");

  if (!product) {

    productName.textContent =
      "Invalid Product";

    productPrice.textContent =
      "";

    payButton.disabled = true;

    message.textContent =
      "Invalid product selected.";

  } else {

    productName.textContent =
      product.name;

    productPrice.textContent =
      "₹" + product.amount;
  }


  document
    .getElementById("paymentForm")
    .addEventListener("submit", async function(event) {

      event.preventDefault();

      if (!product) return;

      const name =
        document
          .getElementById("name")
          .value
          .trim();

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const phone =
        document
          .getElementById("phone")
          .value
          .replace(/\D/g, "");

      if (name.length < 2) {
        message.textContent =
          "Please enter a valid name.";
        return;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        message.textContent =
          "Please enter a valid email.";
        return;
      }

      if (!/^\d{10}$/.test(phone)) {
        message.textContent =
          "Please enter a valid 10-digit mobile number.";
        return;
      }

      payButton.disabled = true;
      payButton.textContent =
        "Creating Payment...";

      message.textContent = "";

      try {

        const response =
          await fetch("/api/create-order", {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              productId: productId,

              customer: {
                name: name,
                email: email,
                phone: phone
              }

            })

          });


        const data =
          await response.json();


        if (!response.ok || !data.success) {

          throw new Error(
            data.message ||
            "Unable to create payment."
          );
        }


        const cashfree =
          Cashfree({
            mode: "sandbox"
          });


        await cashfree.checkout({

          paymentSessionId:
            data.payment_session_id,

          redirectTarget:
            "_self"

        });

      } catch (error) {

        console.error(error);

        message.textContent =
          error.message ||
          "Payment could not be started.";

        payButton.disabled = false;

        payButton.textContent =
          "Pay Securely";
      }

    });

</script>

</body>
</html>

name: Build USOA Android APK
on:
  push:
    branches: [android-export-app]
    paths: ['android-app/**', 'kanish.html', '.github/workflows/android-export.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build and lint
        run: gradle -p android-app :app:assembleDebug :app:lintDebug --no-daemon
      - name: Verify signature
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose android-app/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: USOA-GROUP-Billing-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

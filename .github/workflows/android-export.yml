name: Build USOA Android APK
on:
  push:
    branches: [android-v4-production]
    paths: ['android-app/**', 'kanish.html', '.github/workflows/android-export.yml']
  workflow_dispatch:
concurrency:
  group: usoa-v4-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            curl -fLsS https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -o /tmp/android-tools.zip
            unzip -q /tmp/android-tools.zip -d /tmp/android-tools
            mv /tmp/android-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/manual"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/manual/bin/sdkmanager"
          fi
          (yes || true) | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > android-app/local.properties
      - name: Foundation unit tests
        run: |
          mkdir -p /tmp/usoa-tests
          javac -d /tmp/usoa-tests android-app/app/src/main/java/in/usoagroup/exportbilling/FiscalNumbers.java android-app/tests/FiscalNumbersTest.java android-app/app/src/main/java/in/usoagroup/exportbilling/BackupCrypto.java android-app/tests/BackupCryptoTest.java
          java -cp /tmp/usoa-tests in.usoagroup.exportbilling.FiscalNumbersTest
          java -cp /tmp/usoa-tests in.usoagroup.exportbilling.BackupCryptoTest
          cd android-app
          node tests/billing-safeguards.mjs
      - name: Build APK
        run: gradle -p android-app :app:assembleDebug :app:assembleRelease --no-daemon
      - name: Validate bundled assets
        run: |
          node --check android-app/app/src/main/assets/assets/orbit-editor.js
          node --check android-app/app/src/main/assets/assets/domestic-workspace.js
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/kanish.html'
          unzip -l android-app/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/domestic.html'
      - name: Lint
        run: |
          gradle -p android-app :app:lintDebug --no-daemon || {
            find android-app/app/build -name 'lint-results-debug.txt' -exec cat {} \;
            exit 1
          }
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android emulator integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle -p android-app :app:connectedDebugAndroidTest --no-daemon
      - name: Save Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: USOA-v4-instrumentation-results
          path: |
            android-app/app/build/outputs/androidTest-results/
            android-app/app/build/reports/androidTests/
          if-no-files-found: ignore
      - name: Verify signature
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose android-app/app/build/outputs/apk/debug/app-debug.apk
      - name: Collect unsigned release and signing utility
        run: |
          mkdir -p release-material
          cp android-app/app/build/outputs/apk/release/app-release-unsigned.apk release-material/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" release-material/
      - uses: actions/upload-artifact@v4
        with:
          name: USOA-v4-alpha-unsigned-material
          path: release-material/
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: USOA-v4-alpha-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">

  <title>Payment Status | USOA GROUP</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
    }

    .card {
      width: 100%;
      max-width: 500px;
      background: white;
      padding: 35px 25px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    .icon {
      font-size: 60px;
      margin-bottom: 15px;
    }

    h1 {
      margin: 10px 0;
    }

    .status {
      font-size: 20px;
      font-weight: bold;
      margin: 20px 0;
    }

    .order {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 10px;
      word-break: break-all;
      margin: 20px 0;
    }

    .amount {
      font-size: 22px;
      font-weight: bold;
      margin: 15px 0;
    }

    .message {
      color: #555;
      margin: 15px 0;
      line-height: 1.5;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 13px 22px;
      border-radius: 8px;
      background: #111;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .loading {
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="icon" id="icon">
      ⏳
    </div>

    <h1 id="title">
      Checking Payment
    </h1>

    <div class="status" id="status">
      Please wait...
    </div>

    <div class="order" id="orderBox">
      Order ID: Loading...
    </div>

    <div class="amount" id="amount">
    </div>

    <div class="message" id="message">
      We are verifying your payment with Cashfree.
    </div>

    <a class="button" href="/products.html">
      Back to Products
    </a>

  </div>


<script>

const params =
  new URLSearchParams(window.location.search);

const orderId =
  params.get("order_id");

const icon =
  document.getElementById("icon");

const title =
  document.getElementById("title");

const status =
  document.getElementById("status");

const orderBox =
  document.getElementById("orderBox");

const amount =
  document.getElementById("amount");

const message =
  document.getElementById("message");


if (!orderId) {

  icon.textContent = "❌";

  title.textContent =
    "Invalid Payment";

  status.textContent =
    "Order ID not found.";

  message.textContent =
    "We could not find a valid Cashfree order ID.";

} else {

  orderBox.textContent =
    "Order ID: " + orderId;

  checkPayment();

}


async function checkPayment() {

  try {

    const response =
      await fetch(
        "/api/order-status?order_id=" +
        encodeURIComponent(orderId)
      );

    const data =
      await response.json();


    if (!response.ok || !data.success) {

      throw new Error(
        data.message ||
        "Unable to verify payment."
      );

    }


    const paymentStatus =
      String(
        data.order_status || "UNKNOWN"
      ).toUpperCase();


    if (paymentStatus === "PAID") {

      icon.textContent = "✅";

      title.textContent =
        "Payment Successful";

      status.textContent =
        "PAID";

      amount.textContent =
        "₹" +
        Number(data.order_amount || 0)
          .toFixed(2);

      message.textContent =
        "Your payment has been successfully verified by Cashfree.";

      return;
    }


    if (
      paymentStatus === "FAILED" ||
      paymentStatus === "CANCELLED"
    ) {

      icon.textContent = "❌";

      title.textContent =
        "Payment Failed";

      status.textContent =
        paymentStatus;

      message.textContent =
        "The payment was not completed. You can try again from the products page.";

      return;
    }


    if (
      paymentStatus === "ACTIVE" ||
      paymentStatus === "PENDING"
    ) {

      icon.textContent = "⏳";

      title.textContent =
        "Payment Processing";

      status.textContent =
        paymentStatus;

      message.textContent =
        "Payment is still being processed. Checking again...";

      setTimeout(checkPayment, 3000);

      return;
    }


    icon.textContent = "ℹ️";

    title.textContent =
      "Payment Status";

    status.textContent =
      paymentStatus;

    message.textContent =
      "Current payment status received from Cashfree.";

  } catch (error) {

    console.error(error);

    icon.textContent = "⚠️";

    title.textContent =
      "Unable to Verify";

    status.textContent =
      "Verification Error";

    message.textContent =
      error.message ||
      "Please try again after a moment.";

  }

}

</script>

</body>
</html>
